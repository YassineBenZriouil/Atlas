[project]
name = "atlas"
version = "0.1.0"
description = "Local, deterministic, free voice-controlled Windows assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Yassine Ben Zriouil" }]

dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "PySide6>=6.7",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pyttsx3>=2.90",
    "tomli-w>=1.0",
    "pycaw>=20240210; sys_platform == 'win32'",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
atlas = "atlas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
